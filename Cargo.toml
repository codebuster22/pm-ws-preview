[package]
name = "pm-ws"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Prediction-market data-feed daemon: authoritative order books from venue WebSocket feeds, published to local Rust, Python, and TypeScript consumers at microsecond latency"
repository = "https://github.com/codebuster22/pm-ws-preview"
keywords = ["prediction-markets", "order-book", "websocket", "market-data", "low-latency"]
categories = ["finance", "network-programming"]
exclude = ["/bench", "/docs", "/bindings", "/.github", "/tests", "/check", "/about.hbs", "/about.toml", "/deny.toml", "/rust-toolchain.toml"]

[[bin]]
name = "pmws-run"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

# An example's unit tests are not run by `cargo test` unless its target says so.
[[example]]
name = "latency_probe"
test = true

[[example]]
name = "matched_consumer"
test = true

[[example]]
name = "embedded_live"
test = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.51.4", features = ["rt", "macros", "time", "net", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
libc = { version = "=0.2.189", default-features = false, features = ["std"] }
memmap2 = "=0.9.11"
toml = { version = "=1.1.4", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
debug = "line-tables-only"
debug-assertions = false
overflow-checks = true
